# ============ 全局配置 ============
# 端口监听与网站路由已改由启动词库 start.n 中的「$创建服务器$ + $服务器.启动$」负责。
# 本段仅保留全局共用配置。
HTTP:
  # 临时读写清理周期（秒）
  临时读写清理周期: 60
  # 调试开关：开启后打印词库缓存等调试信息
  调试: false
  # 词库编译缓存：开启后将词库编译结果缓存到 private/.dic_cache 加速加载，默认关闭
  词库编译缓存: false

WebSocket:
  启用: false
  访问路径: ws
  跨域: true

云工具服务端:
  # 是否开启内置云工具服务端
  启用: false
  # 访问路径（客户端连接 ws://host:port/{访问路径}/{账号}）
  访问路径: cloudtool
  # 是否允许任意账号自动注册（关闭时仅白名单账号可登录）
  任意账号注册: true
  # 账号白名单，多个用逗号或换行分隔；留空表示不限制
  白名单: ""
  # 云工具词库目录（相对 private/，目录下所有 .n 文件都会加载）
  词库目录: cloudtool
  # 断开自动注销时长（秒）：连接断开时本次在线时长低于该值即自动注销，0 表示关闭
  断开注销时长: 30
  # 调试打印
  调试: false

管理面板:
  启用: true
  访问路径: nebula

词库调试:
  # 词库调试页面的初始默认配置
  默认词库: private/debug.n
  触发文本: Main
  保存运行: false
  实时保存: false
  超时: 15

Ngrok:
  启用: false
  密钥: xxx
  # 留空获取随机域名，仅限Ngrok域名
  访问链接: ""
  # 要转发的本地 HTTP 服务器监听地址（留空转发到核心服务器）
  服务器: ""

FTP:
  启用: false
  端口: 21
  用户名: admin
  密码: ""
  调试: false
  TLS: true
  PASV端口起始: 32000
  PASV端口结束: 32005

SFTP:
  启用: false
  端口: 22
  用户名: root
  密码: ""
  调试: false

# ============ 机器人对接配置 ============

QQ:
  启用: false
  词库: private/bot/qq
  访问路径: qq-bot
  APPID: "123456"
  密钥: xxx
  调试打印: false
  WebSocket: false
  # 意图值(监听码): 默认含群聊+C2C+群成员+按钮+审核+频道，公域=1325404163/私域=251662851，无审批的意图网关跳过
  # 纯群机器人可只订阅群事件: 群消息/C2C/好友/机器人进退群/入群申请=33554432，+群成员进退群=50331648，+按钮=117440512
  监听码: 0

NapCat:
  # 包含特殊符号需要放在双引号中
  启用: false
  词库: private/bot/napcat
  访问路径: napcat
  发送消息接口: "http://127.0.0.1:3000"
  # 此处填HTTP服务器的Token不是HTTP客户端的，更换登录账号需要进机器人消息端webUI重新获取，每个账号对应一个
  密钥: xxx

云湖:
  启用: false
  词库: private/bot/yunhu/dic.n
  访问路径: yunhu-bot
  密钥: xxx

飞书:
  启用: false
  词库: private/bot/feishu
  访问路径: feishu-bot
  APPID: cli_xxx
  密钥: xxx

Secluded:
  # Secluded 插件协议（WebSocket客户端模式）
  启用: false
  词库: private/bot/secluded
  对接地址: "ws://127.0.0.1:24804"
  令牌: SecretToken
  调试打印: false
