# ============ HTTP 服务器（支持多开） ============
# 每个 [HTTP]、[HTTP2]、[HTTP3]... 段代表一个独立的 HTTP/HTTPS 服务器。
# 监听地址、绑定域名、映射目录、路由词库、跨域、TLS 均为每个服务器独立配置。
# 仅「调试」「临时读写清理周期」为全局共用，在 [HTTP] 段填写即可。
[HTTP]
server = 0.0.0.0:8080
# 是否启用该服务器（实时开关，关闭后仅保留管理面板/机器人等内置入口）
启用 = true
# 绑定域名（可选，支持换行绑定多个域名）：公网域名解析到本机后通过该域名访问，留空则使用监听地址访问
绑定域名 =
# 映射目录（网站根目录）：访问上面绑定的域名时提供该目录下的静态文件（宝塔「网站根目录」效果），留空走词库路由；第一个服务器默认 public
映射目录 = public
# 路由词库文件：处理该服务器 HTTP 请求的词库（.n），留空使用默认路由词库 private/system/router.n
路由词库 =
# 跨域开关：是否允许该服务器响应跨域请求
跨域 = true
# 跨域白名单：* 或逗号分隔的来源地址，如 http://example.com,http://localhost:3000
跨域白名单 = "*"
# ---- 以下为全局共用配置（仅 [HTTP] 段生效） ----
临时读写清理周期 = 60
# 调试开关：开启后打印词库缓存等调试信息
调试 = false
# ---- 以下为当前服务器配置 ----
TLS = false
# HTTPS 证书来源：file（手动路径）/ self（自签名）/ upload（上传）/ system（Windows 系统证书库）/ acme（Let's Encrypt）
TLS方式 = file
TLS证书文件 =
TLS密钥文件 =
# acme（Let's Encrypt）域名列表，逗号分隔
TLS域名 =
# acme 邮箱（可选，用于证书到期提醒）
TLS邮箱 =
# ---- BeerWebFrp 穿透（每个服务器独立配置） ----
# 是否启用 BeerWebFrp 隧道穿透
Frp启用 = false
# BeerWebFrp 服务端 WebSocket 地址（http/https 会自动转为 ws/wss）
Frp服务端地址 = wss://frp.cjxpj.com
# BeerWebFrp 隧道密钥
Frp令牌 =
# 是否输出 BeerWebFrp 调试日志
Frp调试 = false

# 如需多开，取消下面 [HTTP2] 的注释并修改配置即可（[HTTP3]、[HTTP4] 依此类推）
# [HTTP2]
# server = 0.0.0.0:8081
# 启用 = true
# 绑定域名 =
# 映射目录 =
# 路由词库 =
# 跨域 = false
# 跨域白名单 = "*"
# TLS = false
# TLS方式 = file
# TLS证书文件 =
# TLS密钥文件 =
# TLS域名 =
# TLS邮箱 =
# Frp启用 = false
# Frp服务端地址 = wss://frp.cjxpj.com
# Frp令牌 =
# Frp调试 = false

[WebSocket]
启用 = false
访问路径 = "ws"
跨域 = true

[云工具服务端]
# 是否开启内置云工具服务端
启用 = false
# 访问路径（客户端连接 ws://host:port/{访问路径}/{账号}）
访问路径 = cloudtool
# 是否允许任意账号自动注册（关闭时仅白名单账号可登录）
任意账号注册 = true
# 账号白名单，多个用逗号或换行分隔；留空表示不限制
白名单 = 
# 云工具词库目录（相对 private/，目录下所有 .n 文件都会加载）
词库目录 = cloudtool
# 断开自动注销时长（秒）：连接断开时本次在线时长低于该值即自动注销，0 表示关闭
断开注销时长 = 30
# 调试打印
调试 = false

[管理面板]
启用 = true
访问路径 = nebula

[词库调试]
# 词库调试页面的初始默认配置
默认词库 = private/debug.n
触发文本 = Main
保存运行 = false
实时保存 = false
超时 = 15

[Ngrok]
启用 = false
密钥 = xxx
# 留空获取随机域名，仅限Ngrok域名
访问链接 = ""
# 要转发的本地 HTTP 服务器监听地址（留空转发到主服务器，即第一个 [HTTP]）
服务器 = 

