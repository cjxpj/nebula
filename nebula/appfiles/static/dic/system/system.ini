[HTTP]
server = 0.0.0.0:8080
# 绑定域名（可选）：公网域名解析到本机后，通过该域名访问（配合反向代理/Ngrok），留空则使用监听地址
绑定域名 =
跨域 = true
跨域白名单 = "*"
临时读写清理周期 = 60
# 调试开关：开启后打印词库缓存等调试信息
调试 = false
# HTTPS 证书来源：file（手动路径）/ self（自签名）/ upload（上传）/ system（Windows 系统证书库）/ acme（Let's Encrypt）
TLS方式 = file
# acme（Let's Encrypt）域名列表，逗号分隔
TLS域名 =
# acme 邮箱（可选，用于证书到期提醒）
TLS邮箱 =

[WebSocket]
启用 = false
访问路径 = "ws"
跨域 = true

[云工具服务端]
# 是否开启内置云工具服务端
启用 = false
# 访问路径（客户端连接 ws://host:port/{访问路径}/{账号}）
访问路径 = cloudtool
# 是否允许任意账号自动注册（关闭时仅白名单账号可登录）
任意账号注册 = true
# 账号白名单，多个用逗号或换行分隔；留空表示不限制
白名单 = 
# 云工具词库目录（相对 private/，目录下所有 .n 文件都会加载）
词库目录 = cloudtool
# 断开自动注销时长（秒）：连接断开时本次在线时长低于该值即自动注销，0 表示关闭
断开注销时长 = 30
# 调试打印
调试 = false

[管理面板]
启用 = true
访问路径 = nebula

[词库调试]
# 词库调试页面的初始默认配置
